[Explain]: 过去两年内的违规（penalty point offences）必须少于4次，否则不符合要求。
[Reference]: Chapter 1 – Offence

#C01-10 What is required regarding Criminal Code convictions?
a) One allowed
b) Two allowed
c) None allowed
d) Only warnings
[Correct Answer]: c)
[Explain]: 过去三年内不得有刑事违法记录（Criminal Code convictions），属于一票否决条件。
[Reference]: Chapter 1 – Criminal

#C01-11 What language ability is required?
a) Any language
b) Translator allowed
c) Spoken and written English
d) No requirement
[Correct Answer]: c)
[Explain]: 必须具备英语听说读写能力（spoken and written English），考试不允许辅助。
[Reference]: Chapter 1 – Language

#C01-12 Can you receive assistance during the knowledge test?
a) Yes
b) Only instructor
c) No
d) Only translation
[Correct Answer]: c)
[Explain]: 知识考试必须独立完成（without assistance），不能使用翻译或他人帮助。
[Reference]: Chapter 1 – Rule

#C01-13 What happens if you arrive late for a test?
a) Still take it
b) May be refused
c) Extra time
d) No effect
[Correct Answer]: b)
[Explain]: 如果迟到（late arrival），可能被拒绝参加考试。
[Reference]: Chapter 1 – Time

#C01-14 What is required regarding medical fitness?
a) Optional
b) Self-report only
c) Medical declaration and exam
d) No requirement
[Correct Answer]: c)
[Explain]: 必须完成医疗申报（medical declaration）并可能需要体检（medical exam）。
[Reference]: Chapter 1 – Medical

#C01-15 What must commercial drivers meet regarding vision?
a) Basic only
b) None
c) Higher vision standards
d) Only color
[Correct Answer]: c)
[Explain]: 商业驾驶需要更高的视力标准（vision standards），包括周边视觉（peripheral vision）和颜色识别（colour perception）。
[Reference]: Chapter 1 – Vision

#C01-16 What must you do if corrective lenses are required?
a) Optional
b) Only test
c) Always wear them
d) Only night
[Correct Answer]: c)
[Explain]: 如果有要求，必须佩戴矫正眼镜（corrective lenses），属于驾照限制条件（licence condition）。
[Reference]: Chapter 1 – Lenses

#C01-17 How long is a learner licence valid?
a) 6 months
b) 1 year
c) 2 years
d) 5 years
[Correct Answer]: b)
[Explain]: 学习驾照（learner’s licence）的有效期为一年。
[Reference]: Chapter 1 – Learner

#C01-18 Where must the supervisor sit?
a) Anywhere
b) Back left
c) Beside or right rear
d) Outside
[Correct Answer]: c)
[Explain]: 监督员必须坐在驾驶员旁边或右后方（beside or right rear），以便及时干预。
[Reference]: Chapter 1 – Supervisor

#C01-19 Are passengers allowed with a learner licence?
a) Yes
b) Family only
c) No
d) One allowed
[Correct Answer]: c)
[Explain]: 学习阶段不允许载客（no passengers），以减少风险和干扰。
[Reference]: Chapter 1 – Passenger

#C01-20 What does a road test include?
a) Driving only
b) Parking
c) Inspection and driving
d) Written
[Correct Answer]: c)
[Explain]: 路考包括出车检查（pre-trip inspection）、气刹测试（air brake test）和道路驾驶。
[Reference]: Chapter 1 – Road Test

#C01-21 Who is responsible for vehicle insurance?
a) ICBC
b) Employer
c) Driver
d) Police
[Correct Answer]: c)
[Explain]: 司机必须确保车辆已投保（properly insured），责任在司机本人。
[Reference]: Chapter 1 – Insurance

#C01-22 What happens if driving without proper licence class?
a) No issue
b) Warning
c) Insurance may be void
d) Lower fine
[Correct Answer]: c)
[Explain]: 如果使用错误驾照（improper licence），可能导致保险无效（insurance void）。
[Reference]: Chapter 1 – Risk

#C02-01 What do brakes convert motion into?
a) Pressure
b) Fuel
c) Heat
d) Cold
[Correct Answer]: c)
[Explain]: 制动系统（brakes）通过摩擦（friction）将动能（motion）转化为热能（heat），这是刹车工作的核心原理。
[Reference]: Chapter 2 – Heat & Energy

#C02-02 What has a greater effect on stopping distance than weight?
a) Engine size
b) Speed
c) Brake size
d) Fuel level
[Correct Answer]: b)
[Explain]: 速度（speed）对制动距离（stopping distance）的影响比重量更大，因为动能与速度平方相关。
[Reference]: Chapter 2 – Speed vs Weight

#C02-03 What do brakes convert energy into?
a) Pressure
b) Heat
c) Air
d) Cold
[Correct Answer]: b)
[Explain]: 刹车（brakes）会把车辆的动能（motion energy）转化为热能（heat）。
[Reference]: Chapter 2 – Energy Conversion

#C02-04 Why can brakes fail on long hills?
a) Low fuel
b) Too much heat
c) Weak tires
d) Cold weather
[Correct Answer]: b)
[Explain]: 刹车只能吸收有限热量（limited amount of heat）。长时间下坡会导致过热（overheating）和失效。
[Reference]: Chapter 2 – Heat Capacity

#C02-05 What causes brake fade?
a) Cold brakes
b) Low pressure
c) Excessive heat
d) Heavy cargo
[Correct Answer]: c)
[Explain]: 过多热量（excessive heat）会降低摩擦效果，导致刹车衰减（brake fade）。
[Reference]: Chapter 2 – Brake Fade

#C02-06 What is the maximum fine for improperly adjusted brakes?
a) $500
b) $1000
c) $2000
d) $5000
[Correct Answer]: c)
[Explain]: 如果刹车未正确调整（not adjusted correctly），可能被罚款（fine）最高2000加元。
[Reference]: Chapter 2 – Fine

#C02-07 When should retarders not be used?
a) Dry roads
b) Highways
c) Slippery roads
d) City streets
[Correct Answer]: c)
[Explain]: 湿滑路面（slippery roads）使用缓速器（retarder）可能导致驱动轮打滑（skid）。
[Reference]: Chapter 2 – Retarder

#C02-08 When should the proper gear be selected for a downgrade?
a) After starting downhill
b) Before starting downhill
c) Halfway down
d) At the bottom
[Correct Answer]: b)
[Explain]: 下坡前（before downgrade）应提前选择合适挡位（proper gear），利用发动机制动（engine braking）控制车速。
[Reference]: Chapter 2 – Gear before hill

#C02-09 Why should intermittent braking be used?
a) To save fuel
b) To reduce noise
c) To prevent overheating
d) To increase speed
[Correct Answer]: c)
[Explain]: 间歇制动（intermittent braking）可以减少热量积累（heat buildup），防止刹车过热（overheating）。
[Reference]: Chapter 2 – Intermittent braking

#C02-10 What reduces traction between the tires and the road?
a) Fuel
b) Water
c) Cold air
d) Pressure
[Correct Answer]: b)
[Explain]: 水（water）会降低抓地力（traction），增加打滑和失控风险。
[Reference]: Chapter 2 – Traction

#C02-11 What can happen if the trailer pushes the tractor during braking?
a) Better braking
b) Jackknife
c) Lower pressure
d) Brake cooling
[Correct Answer]: b)
[Explain]: 挂车推动牵引车（trailer pushing tractor）时，可能导致折刀（jackknife）。
[Reference]: Chapter 2 – Trailer push

#C02-12 When should runaway lanes be used?
a) After stopping
b) Only with permission
c) Immediately
d) Only at night
[Correct Answer]: c)
[Explain]: 车辆失控时必须立即（immediately）使用逃生车道（runaway lane），避免事故。
[Reference]: Chapter 2 – Runaway lane

#C08-01 What is another name for a safety valve?
a) Control valve
b) Pop-off valve
c) Relay valve
d) Foot valve
[Correct Answer]: b)
[Explain]: 安全阀（safety valve）也被称为pop-off valve（泄压阀）。当系统压力过高（overpressure）时，它会自动释放气压，防止系统损坏。
[Reference]: Chapter 8 – Safety Valve

#C08-02 Where is the safety valve located on an air reservoir?
a) Bottom
b) Inside
c) Top
d) Side
[Correct Answer]: c)
[Explain]: 储气罐（air reservoir）的安全阀（safety valve）位于顶部（top），因为高压空气集中在上部。
[Reference]: Chapter 8 – Reservoir Structure

#C08-03 Where is the drain cock located on an air reservoir?
a) Top
b) Bottom
c) Side
d) Inside
[Correct Answer]: b)
[Explain]: 排水阀（drain cock）位于储气罐底部（bottom），因为水分（moisture）会沉积到底部。
[Reference]: Chapter 8 – Reservoir Structure

#C08-04 Why should you allow enough time when draining reservoirs?
a) To increase pressure
b) To cool the brakes
c) To ensure complete drainage
d) To lubricate valves
[Correct Answer]: c)
[Explain]: 排放储气罐（draining reservoirs）时必须确保完全排空（complete drainage），否则残留水分可能导致结冰（freezing）或腐蚀。
[Reference]: Chapter 8 – Drain Reservoirs

#C08-05 Why can compressed air be dangerous?
a) It is hot
b) It moves slowly
c) It escapes under high pressure
d) It is dirty
[Correct Answer]: c)
[Explain]: 压缩空气（compressed air）在高压（high pressure）下释放时，可能伤害眼睛和耳朵。
[Reference]: Chapter 8 – Compressed Air Danger

#C08-06 What should you do when draining air reservoirs?
a) Stand in front of the air stream
b) Stay out of the direct air path
c) Close the safety valve
d) Increase pressure
[Correct Answer]: b)
[Explain]: 排放空气时应避免站在气流路径（direct path）中，以防被高压空气直接冲击。
[Reference]: Chapter 8 – Air Path

#C08-07 What is the function of an air dryer?
a) Increase pressure
b) Remove moisture
c) Add alcohol
d) Cool brakes
[Correct Answer]: b)
[Explain]: 空气干燥器（air dryer）用于去除水分（moisture），防止系统结冰（freezing）和腐蚀（corrosion）。
[Reference]: Chapter 8 – Air Dryer

#C08-08 What is the purpose of an alcohol evaporator?
a) Increase braking force
b) Store compressed air
c) Prevent freezing
d) Reduce pressure
[Correct Answer]: c)
[Explain]: 酒精蒸发器（alcohol evaporator）用于防止气刹系统（air brake system）中的水分结冰。
[Reference]: Chapter 8 – Alcohol Evaporator

#C08-09 What can happen if brakes are compounded?
a) Pressure decreases
b) Brakes cool faster
c) Brake damage may occur
d) Nothing happens
[Correct Answer]: c)
[Explain]: 叠加制动（compounding）是同时使用service brake和spring brake，会产生过大制动力（excessive braking force），可能损坏系统。
[Reference]: Chapter 8 – Compounding

#C08-10 Where is the ABS warning light positioned on a trailer?
a) Inside the cab
b) On the dashboard
c) On the rear side of the trailer
d) Under the tractor
[Correct Answer]: c)
[Explain]: ABS警示灯（ABS warning light）位于挂车后侧（rear side of the trailer），驾驶员应能通过后视镜（side mirror）观察。
[Reference]: Chapter 8 – Trailer ABS Light

#C09-01 Why is brake adjustment important?
a) To reduce fuel use
b) For appearance
c) For safety and legal compliance
d) To increase speed
[Correct Answer]: c)
[Explain]: 刹车调整（brake adjustment）不仅影响安全（safety），也是法律要求（required by law）。调整不正确的车辆会被视为不安全车辆（unsafe vehicle）。
[Reference]: Chapter 9 – Brake Adjustment Law

#C09-02 Who is responsible for ensuring brakes are properly adjusted?
a) Mechanic
b) Company
c) Driver
d) Police
[Correct Answer]: c)
[Explain]: 驾驶员（driver）必须确保刹车已正确调整（properly adjusted），即使车辆属于公司，责任仍在司机本人。
[Reference]: Chapter 9 – Driver Responsibility

#C09-03 What is pushrod stroke?
a) Brake temperature
b) Distance the pushrod travels
c) Air pressure level
d) Brake lining thickness
[Correct Answer]: b)
[Explain]: 推杆行程（pushrod stroke）是施加刹车时（brakes applied）推杆移动的距离（distance）。
[Reference]: Chapter 9 – Pushrod Stroke

#C09-04 How should brakes be applied when measuring pushrod stroke?
a) Partially applied
b) Released
c) Fully applied
d) Rapidly pumped
[Correct Answer]: c)
[Explain]: 测量推杆行程（stroke）时，必须完全踩下刹车（fully applied），否则结果不准确。
[Reference]: Chapter 9 – Applied Stroke

#C09-05 What tool can be used to measure free stroke?
a) Hammer
b) Pry bar
c) Torque wrench
d) Pipe wrench
[Correct Answer]: b)
[Explain]: 可以使用撬杆（pry bar）测量自由行程（free stroke），用于检查间隙调节器状态。
[Reference]: Chapter 9 – Pry Method

#C09-06 What must be done with manual slack adjusters?
a) Replace weekly
b) Adjusted regularly
c) Filled with oil
d) Left untouched
[Correct Answer]: b)
[Explain]: 手动间隙调节器（manual slack adjusters）必须定期调整（adjusted regularly），否则会导致制动效果下降。
[Reference]: Chapter 9 – Manual Slack Adjuster

#C09-07 What does it usually mean if an automatic slack adjuster requires routine manual adjustment?
a) System is normal
b) Brakes are cold
c) There may be a system problem
d) Pressure is too high
[Correct Answer]: c)
[Explain]: 自动间隙调节器（automatic slack adjuster）通常不应频繁手调。如果需要，通常表示系统存在问题（system problem）。
[Reference]: Chapter 9 – Automatic Slack Adjuster

#C09-08 What do brake adjustment indicators show?
a) Fuel level
b) Brake adjustment status
c) Brake temperature
d) Tire pressure
[Correct Answer]: b)
[Explain]: 刹车调整指示器（adjustment indicators）用于显示刹车调整状态（adjustment status）。
[Reference]: Chapter 9 – Adjustment Indicator

#C09-09 What can incorrect brake adjustment cause?
a) Better traction
b) Lower fuel use
c) Brake failure or uneven braking
d) Higher air pressure
[Correct Answer]: c)
[Explain]: 错误调整（incorrect adjustment）可能导致刹车失效（brake failure）或制动力不均（uneven braking）。
[Reference]: Chapter 9 – Incorrect Adjustment

#C09-10 How often should brake adjustment be checked?
a) Once a year
b) Only after repair
c) Regularly
d) Only during inspection
[Correct Answer]: c)
[Explain]: 由于刹车系统会磨损（wear），因此必须定期（regularly）检查刹车调整状态。
[Reference]: Chapter 9 – Regular Inspection

#C10-01 Who is responsible for ensuring the vehicle is safe?
a) Employer
b) Mechanic
c) Driver
d) Police
[Correct Answer]: c)
[Explain]: 司机（driver）对车辆安全（vehicle safety）负最终责任，不论车辆属于谁。
[Reference]: Chapter 10 – Responsibility

#C10-02 Are pre-trip inspections required under the National Safety Code?
a) No
b) Only for buses
c) Yes
d) Only for trailers
[Correct Answer]: c)
[Explain]: 出车前检查（pre-trip inspection）属于国家安全法规（National Safety Code）要求，并非可选项目。
[Reference]: Chapter 10 – Pre-trip Inspection Law

#C10-03 When must a pre-trip inspection be completed?
a) After the trip
b) Before the first run of the day
c) Only once a week
d) Only after repairs
[Correct Answer]: b)
[Explain]: 每天第一次出车前（before the first run）必须完成检查，即使前一天已经检查过。
[Reference]: Chapter 10 – Inspection Time

#C10-04 What is the purpose of a pre-trip inspection?
a) Reduce fuel use
b) Identify defects or unsafe conditions
c) Increase speed
d) Warm up brakes
[Correct Answer]: b)
[Explain]: 出车检查（inspection）的主要目的是发现故障（defects）或不安全状态（unsafe conditions）。
[Reference]: Chapter 10 – Inspection Purpose

#C10-05 How are defects classified?
a) Safe or unsafe
b) Large or small
c) Minor or major
d) Legal or illegal
[Correct Answer]: c)
[Explain]: 故障（defects）分为轻微（minor）和严重（major）两类。
[Reference]: Chapter 10 – Defect Classification

#C10-06 What must you do if a major defect is found?
a) Continue driving carefully
b) Report later
c) Do not operate the vehicle
d) Reduce speed
[Correct Answer]: c)
[Explain]: 发现严重故障（major defect）后，不得继续操作车辆（do not operate）。
[Reference]: Chapter 10 – Major Defect

#C10-07 Are air brake system tests part of the inspection?
a) No
b) Only in winter
c) Yes
d) Only for trucks
[Correct Answer]: c)
[Explain]: 气刹系统测试（air brake system tests）属于出车检查的一部分，必须执行。
[Reference]: Chapter 10 – Air Brake Test

#C10-08 What condition must the engine be in during a leakage test?
a) Running fast
b) Idle
c) Off
d) Warm
[Correct Answer]: c)
[Explain]: 进行泄漏测试（leakage test）时，发动机（engine）必须关闭（off），避免压缩机影响结果。
[Reference]: Chapter 10 – Leak Test Conditions

#C10-09 What condition must the brakes be in during a leakage test?
a) Fully applied
b) Released
c) Hot
d) Cold
[Correct Answer]: b)
[Explain]: 进行泄漏测试时，刹车（brakes）必须释放（released）。
[Reference]: Chapter 10 – Leak Test Conditions

#C10-10 How is air leakage measured?
a) Km/h
b) PSI per minute
c) Litres
d) RPM
[Correct Answer]: b)
[Explain]: 空气泄漏（air leakage）标准以每分钟psi（psi per minute）计算。
[Reference]: Chapter 10 – Leakage Rate

#C10-11 When must the low-air warning activate?
a) After 60 psi
b) Before 60 psi
c) At 100 psi
d) At 120 psi
[Correct Answer]: b)
[Explain]: 低气压警报（low-air warning）必须在60 psi之前启动（activate）。
[Reference]: Chapter 10 – Low Air Warning

#C10-12 What happens when air pressure becomes low?
a) Spring brakes apply automatically
b) Pressure increases
c) Brakes release
d) Compressor stops
[Correct Answer]: a)
[Explain]: 当气压降低（low pressure）时，弹簧刹车（spring brakes）会自动启动（apply automatically），属于fail-safe设计。
[Reference]: Chapter 10 – Spring Brake

#C10-13 What may happen if inspections are skipped?
a) Better fuel economy
b) Unsafe operation
c) Lower pressure
d) Brake cooling
[Correct Answer]: b)
[Explain]: 跳过检查（skip inspection）可能导致不安全驾驶（unsafe operation）和事故风险。
[Reference]: Chapter 10 – Inspection Risk

#C10-14 Must you explain to the examiner what you are checking?
a) No
b) Only if asked
c) Yes
d) Only during brake tests
[Correct Answer]: c)
[Explain]: 路考时必须向考官（examiner）说明正在检查的内容。
[Reference]: Chapter 10 – Verbal Explanation

#C10-15 Must a trip inspection report be completed?
a) No
b) Only after repairs
c) Yes
d) Only for trailers
[Correct Answer]: c)
[Explain]: 检查报告（trip inspection report）属于法律要求（legal requirement），必须完成。
[Reference]: Chapter 10 – Inspection Report

#C10-16 What must a driver bring to adjust brakes if needed?
a) Fuel
b) Tools
c) Extra tires
d) Air tank
[Correct Answer]: b)
[Explain]: 司机必须携带工具（tools），以便必要时调整刹车（adjust brakes）。
[Reference]: Chapter 10 – Tools

#C10-17 Why should a systematic inspection sequence be followed?
a) To increase speed
b) To avoid missing items
c) To reduce fuel
d) To warm the engine
[Correct Answer]: b)
[Explain]: 固定检查顺序（systematic inspection sequence）可避免遗漏项目（missing items）。
[Reference]: Chapter 10 – Inspection Sequence


`;

let allQuestions = [];
let activePool = [];
let quizQuestions = [];
let currentIdx = 0;
let userAnswers = [];
let wrongBank = JSON.parse(localStorage.getItem('airBrakeWrongBank')) || [];
let timeLeft = 30 * 60;
let timerInterval = null;
let isWrongPracticeMode = false;
const DEFAULT_QUESTION_COUNT = 25;
const DEFAULT_MINUTES = 30;

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function escapeHtml(text) {
  return String(text ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function stripPrefix(text, label) {
  const re = new RegExp(`^${label}\s*(?:解释)?\s*[:：]?\s*`, 'i');
  return text.replace(re, '').trim();
}

function parseData() {
  const normalized = rawData.replace(/\r/g, '').trim();
  const blocks = normalized.split(/(?=^#[A-Z]\d+-\d+\b)/m).filter(block => block.trim());

  allQuestions = blocks.map((block) => {
    const lines = block.split('\n').map(line => line.trim());
    const firstLine = lines[0] || '';
    const codeMatch = firstLine.match(/^#[A-Z]\d+-\d+/i);
    const code = codeMatch ? codeMatch[0] : 'N/A';

    const contentLines = lines.slice(1).filter(line => line.length > 0);
    const questionLines = [];
    const options = [];
    let correctAnswer = '';
    let explain = '';
    let reference = '';

    for (const line of contentLines) {
      if (/^[a-d]\)/i.test(line)) {
        options.push(line);
        continue;
      }
      if (/^\[Correct Answer\]/i.test(line)) {
        const match = line.match(/([a-d])\)/i);
        if (match) correctAnswer = match[1].toLowerCase();
        continue;
      }
      if (/^\[Explain\]/i.test(line)) {
        explain = stripPrefix(line, '\\[Explain\\]');
        continue;
      }
      if (/^\[(?:Page|Reference)\]/i.test(line)) {
        reference = line
          .replace(/^\[Page\]\s*(?:参考手册页码)?\s*[:：]?\s*/i, '')
          .replace(/^\[Reference\]\s*[:：]?\s*/i, '')
          .trim();
        continue;
      }
      questionLines.push(line);
    }

    const questionText = (firstLine.replace(code, '').trim() || questionLines.shift() || '').trim();
    const extraQuestionText = questionLines.join(' ').trim();
    const finalQuestion = [questionText, extraQuestionText].filter(Boolean).join(' ').trim();

    return {
      code,
      q: finalQuestion,
      options,
      ans: correctAnswer,
      explain,
      reference
    };
  }).filter(q => q.code !== 'N/A' && q.q && q.options.length > 0 && q.ans);

  updateBankInfo();
}

function getRequestedQuestionCount() {
  const raw = parseInt(document.getElementById('questionCountInput').value, 10);
  if (!Number.isFinite(raw) || raw < 1) return DEFAULT_QUESTION_COUNT;
  return raw;
}

function buildActivePool() {
  const filterValue = document.getElementById('filterInput').value.trim().toLowerCase();
  if (!filterValue) return [...allQuestions];

  return allQuestions.filter(q => {
    const haystack = [q.code, q.q, q.options.join(' '), q.explain, q.reference].join(' ').toLowerCase();
    return haystack.includes(filterValue);
  });
}

function updateWrongBankCountOnly() {
  const bankInfoEl = document.getElementById('bankInfo');
  const currentText = bankInfoEl.innerText;
  bankInfoEl.innerText = currentText.replace(/Wrong List:\s*\d+/i, `Wrong List: ${wrongBank.length}`);
}

function updateBankInfo() {
  const filtered = buildActivePool();
  const requested = getRequestedQuestionCount();
  const actual = Math.min(requested, filtered.length || requested);
  document.getElementById('bankInfo').innerText =
    `Question Bank: ${filtered.length} available · Current Set: ${actual} · Wrong List: ${wrongBank.length}`;
}

function applySettings() {
  updateBankInfo();
  initQuiz();
}

function clearSettings() {
  document.getElementById('filterInput').value = '';
  document.getElementById('questionCountInput').value = DEFAULT_QUESTION_COUNT;
  updateBankInfo();
  initQuiz();
}

function initQuiz() {
  isWrongPracticeMode = false;
  activePool = buildActivePool();
  if (activePool.length === 0) {
    alert('No questions match the current filter.');
    return;
  }

  const requestedCount = getRequestedQuestionCount();
  const actualCount = Math.min(requestedCount, activePool.length);
  quizQuestions = shuffle(activePool).slice(0, actualCount);
  document.getElementById('timerDisplay').style.display = 'block';
  startSession();
}

function startSession() {
  currentIdx = 0;
  userAnswers = [];
  document.getElementById('quizContainer').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('reviewScreen').style.display = 'none';
  document.getElementById('wrongBankScreen').style.display = 'none';
  document.getElementById('controlPanel').style.display = 'flex';

  if (!isWrongPracticeMode) startTimer();
  else clearInterval(timerInterval);

  renderQuestion();
  updateBankInfo();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = DEFAULT_MINUTES * 60;
  document.getElementById('timerDisplay').innerText = '30:00';
  timerInterval = setInterval(() => {
    timeLeft--;
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    document.getElementById('timerDisplay').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      finishQuiz();
    }
  }, 1000);
}

function renderQuestion() {
  const q = quizQuestions[currentIdx];
  document.getElementById('questionCounter').innerText = `Question ${currentIdx + 1} / ${quizQuestions.length}`;
  document.getElementById('qCodeDisplay').innerText = `ID: ${q.code}`;

  const html = `
    <div class="question-text">${escapeHtml(q.q)}</div>
    <ul class="options">
      ${q.options.map(opt => `<li class="option-item" onclick="checkAnswer('${opt.charAt(0).toLowerCase()}', this)">${escapeHtml(opt)}</li>`).join('')}
    </ul>
    <div id="feedbackArea" class="feedback-panel">
      <div id="feedbackTitle" style="font-weight:700; font-size:1.1rem; margin-bottom:8px;"></div>
      <span class="feedback-label">Explanation</span>
      <div class="feedback-content">${escapeHtml(q.explain || '-')}</div>
      <span class="feedback-label">Reference</span>
      <div class="feedback-content">${escapeHtml(q.reference || '-')}</div>
    </div>
  `;
  document.getElementById('questionArea').innerHTML = html;
  document.getElementById('btnSkip').style.display = isWrongPracticeMode ? 'none' : 'inline-block';
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('btnAddWrong').style.display = 'inline-block';
}

function addCurrentToWrong() {
  const q = quizQuestions[currentIdx];
  if (!q) return;

  if (!wrongBank.some(w => w.code === q.code)) {
    wrongBank.push(q);
    saveBank();
    updateWrongBankCountOnly();
    alert('Added to Wrong List');
  } else {
    alert('Already in Wrong List');
  }
}

function checkAnswer(choice, element) {
  const q = quizQuestions[currentIdx];
  const isCorrect = choice === q.ans;
  const items = document.querySelectorAll('.option-item');

  items.forEach(item => {
    item.classList.add('disabled');
    if (item.innerText.trim().toLowerCase().startsWith(q.ans)) item.classList.add('correct');
  });

  const title = document.getElementById('feedbackTitle');
  if (!isCorrect) {
    element.classList.add('wrong');
    title.innerHTML = `<span style="color:var(--error-text)">✘ Incorrect</span>`;
    if (!isWrongPracticeMode && !wrongBank.some(w => w.code === q.code)) {
      wrongBank.push(q);
      saveBank();
      updateWrongBankCountOnly();
    }
  } else {
    title.innerHTML = `<span style="color:var(--success-text)">✔ Correct</span>`;
  }

  userAnswers.push({ qIndex: currentIdx, choice, isCorrect });
  document.getElementById('feedbackArea').style.display = 'block';
  document.getElementById('btnSkip').style.display = 'none';
  document.getElementById('btnNext').style.display = 'inline-block';
}

function nextQuestion() {
  if (currentIdx < quizQuestions.length - 1) {
    currentIdx++;
    renderQuestion();
  } else {
    if (isWrongPracticeMode) {
      alert('Practice complete.');
      showWrongBank();
    } else {
      finishQuiz();
    }
  }
}

function finishQuiz() {
  clearInterval(timerInterval);
  document.getElementById('quizContainer').style.display = 'none';
  document.getElementById('controlPanel').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  const correctCount = userAnswers.filter(a => a.isCorrect).length;
  const totalCount = quizQuestions.length;
  const score = totalCount ? Math.round((correctCount / totalCount) * 100) : 0;

  document.getElementById('scoreStatus').innerText = score >= 80 ? 'PASS' : 'FAIL';
  document.getElementById('scoreStatus').style.color = score >= 80 ? 'var(--success-text)' : 'var(--error-text)';
  document.getElementById('scoreDetail').innerText = `Your score is ${score}%. (${correctCount} out of ${totalCount})`;
}

function showReview() {
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('reviewScreen').style.display = 'block';

  let html = '';
  quizQuestions.forEach((q, idx) => {
    const userAns = userAnswers.find(a => a.qIndex === idx);
    const correctOptionText = q.options.find(opt => opt.toLowerCase().startsWith(q.ans)) || q.ans;

    html += `
      <div class="review-item">
        <div class="review-q-text">${idx + 1}. ${escapeHtml(q.q)} <span style="color: var(--text-sub); font-size: 0.85rem;">(${escapeHtml(q.code)})</span></div>

        <div class="review-ans-row ${userAns?.isCorrect ? 'review-correct' : 'review-wrong'}">
          <strong>Your Answer:</strong> ${escapeHtml(userAns ? userAns.choice : 'Skipped')}
        </div>

        <div class="review-ans-row review-correct">
          <strong>Correct Answer:</strong> [${escapeHtml(q.ans)}] - ${escapeHtml(correctOptionText)}
        </div>

        <span class="review-meta-label">Explanation</span>
        <div class="review-meta-content">${escapeHtml(q.explain || '-')}</div>

        <span class="review-meta-label">Reference</span>
        <div class="review-meta-content">${escapeHtml(q.reference || '-')}</div>
      </div>`;
  });

  document.getElementById('reviewList').innerHTML = html;
}

function showWrongBank() {
  document.getElementById('quizContainer').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('controlPanel').style.display = 'none';
  document.getElementById('reviewScreen').style.display = 'none';
  document.getElementById('wrongBankScreen').style.display = 'block';

  let html = '';
  if (wrongBank.length === 0) {
    html = "<p style='text-align:center; padding:60px; color:var(--text-sub);'>No incorrect questions recorded yet.</p>";
  } else {
    wrongBank.forEach((q, idx) => {
      html += `
        <div class="wrong-card">
          <div style="font-weight:600; margin-bottom:12px;">${idx + 1}. ${escapeHtml(q.q)} <span style="color: var(--text-sub); font-size: 0.85rem;">(${escapeHtml(q.code)})</span></div>
          <div style="font-size:0.85rem; color:var(--success-text); margin-bottom:10px; font-weight:600;">Correct Answer: ${escapeHtml(q.ans)}</div>
          <div style="font-size:0.9rem; padding-top:10px; border-top:1px solid #f1f3f4;">${escapeHtml(q.explain || '-')}</div>
          <div style="font-size:0.85rem; color: var(--text-sub); margin-top: 8px;">${escapeHtml(q.reference || '-')}</div>
          <button onclick="removeFromBank('${escapeHtml(q.code)}')" class="btn-ghost" style="margin-top:16px; padding:6px 14px; font-size:0.8rem;">Remove</button>
        </div>`;
    });
  }

  document.getElementById('wrongBankList').innerHTML = html;
}

function startWrongPractice() {
  if (wrongBank.length === 0) {
    alert('Wrong List is empty.');
    return;
  }
  isWrongPracticeMode = true;
  quizQuestions = [...wrongBank];
  document.getElementById('timerDisplay').style.display = 'none';
  startSession();
}

function skipQuestion() {
  const current = quizQuestions[currentIdx];
  const candidates = activePool.filter(q => q.code !== current.code && !quizQuestions.some(x => x.code === q.code));
  if (candidates.length === 0) {
    alert('No more replacement questions available in the current filtered bank.');
    return;
  }
  const replacement = candidates[Math.floor(Math.random() * candidates.length)];
  quizQuestions.splice(currentIdx, 1, replacement);
  renderQuestion();
}

function removeFromBank(code) {
  wrongBank = wrongBank.filter(w => w.code !== code);
  saveBank();
  updateBankInfo();
  showWrongBank();
}

function saveBank() {
  localStorage.setItem('airBrakeWrongBank', JSON.stringify(wrongBank));
}

function hideWrongBank() {
  document.getElementById('wrongBankScreen').style.display = 'none';
  startSession();
}

function restartSim() {
  if (confirm('Start a new test?')) initQuiz();
}

document.getElementById('filterInput').addEventListener('input', updateBankInfo);
document.getElementById('questionCountInput').addEventListener('input', updateBankInfo);

parseData();
initQuiz();
</script>
